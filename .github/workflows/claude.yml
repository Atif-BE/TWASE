# Managed by attila-1212-integration (contrib/workflows); change it there and run hub.py sync.
# Claude works in this repo on a claude/<base>/<kind> branch; this workflow pushes it, automerge.yml takes it from there.
#   - hub-check failed on a push to the tracked branch  -> fix it
#   - "@claude ..." in an issue or comment (write access) -> do the request
#   - dispatched by the hub with task=integrate          -> port a contributor's repo into this one (reviewed, never auto)
name: claude

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_run:
    workflows: [hub-check]
    types: [completed]
  workflow_dispatch:
    inputs:
      task:
        description: "integrate"
        required: true
        default: integrate
      source:
        description: "The hub source to merge into this repo"
        required: true
      ref:
        description: "Its pinned ref"
        required: true

concurrency:
  group: claude-${{ github.event.issue.number || github.event.workflow_run.head_branch || inputs.source }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
       github.event.comment.user.type != 'Bot') ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'push' && !startsWith(github.event.workflow_run.head_branch, 'claude/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.task == 'integrate')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false  # pushes go through SOURCES_TOKEN, so they trigger hub-check
      - uses: actions/checkout@v4
        with:
          repository: Atif-BE/attila-1212-integration
          token: ${{ secrets.SOURCES_TOKEN }}
          path: .hub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Access to the 1212 repos
        env:
          TOKEN: ${{ secrets.SOURCES_TOKEN }}
        run: |
          echo ".hub/" >> .git/info/exclude
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "Claude (1212 automation)"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fetch the pinned parts
        run: python .hub/tools/hub.py fetch
      - name: Task
        id: task
        run: python .hub/tools/claude_task.py
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.task.outputs.prompt }}
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git commit:*),Bash(python .hub/tools/hub.py:*),Bash(python -m unittest:*)"
      - name: Push the work branch
        id: push
        env:
          BRANCH: ${{ steps.task.outputs.branch }}
          BASE_SHA: ${{ steps.task.outputs.base_sha }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then echo "uncommitted changes left behind:"; git status --short; fi
          if [ "$(git rev-list --count "$BASE_SHA..HEAD")" -gt 0 ]; then
            git push --force origin "HEAD:refs/heads/$BRANCH"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report on the issue
        if: always() && steps.task.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.task.outputs.issue }}
          BRANCH: ${{ steps.task.outputs.branch }}
          BASE: ${{ steps.task.outputs.base }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$PUSHED" = "true" ]; then
            body="Claude pushed \`$BRANCH\`. It is merged into \`$BASE\` automatically once hub-check passes. [Run log]($RUN)"
          else
            body="Claude made no commit for this request. Its explanation is at the end of the [run log]($RUN)."
          fi
          gh issue comment "$ISSUE" --body "$body"
